<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Mini App</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Верхняя панель */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        /* Стилизация аватарки строго под круглое золотое лого из ТГ */
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffcc00; /* Золотистая рамка под стиль логотипа */
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        
        .username {
            font-weight: bold;
            font-size: 18px;
            color: #222;
        }
        .reload-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #666;
        }

        /* Центрирование карточки */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin-bottom: 70px;
        }

        /* Карточка товара */
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .item-image {
            width: 100%;
            max-width: 200px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        /* Большая синяя кнопка */
        .inspect-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 14px 0;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(0,123,255,0.4);
            transition: background 0.2s;
        }
        .inspect-btn:hover {
            background-color: #0056b3;
        }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #8e8e93;
            font-size: 12px;
            font-weight: 500;
            width: 33.3%;
            text-align: center;
        }
        .nav-item.active {
            color: #007bff;
        }
        .nav-icon {
            font-size: 26px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="profile-section">
            <!-- По умолчанию установлена картинка из вашего запроса -->
            <img class="avatar" id="user-avatar" src="https://www.anti-malware.ru/files/styles/imagesize400w/public/images/source/robloxonrutube-news.png?itok=n__SYUF6%22%20alt=%22Product%20Image%22" alt="avatar">
            <div class="username" id="user-name">Loading...</div>
        </div>
        <button class="reload-btn" onclick="window.location.reload();">🔄</button>
    </div>

    <div class="main-content">
        <div class="card">
            <img class="item-image" id="product-image" src="https://icons8.com" alt="Product Image">
            <a href="https://tpi.li" target="_blank" class="inspect-btn">ОСМОТРЕТЬ</a>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">➕</span>
            <span>Новые предложения</span>
        </a>
        <a href="https://t.me" target="_blank" class="nav-item">
            <span class="nav-icon">🛠️</span>
            <span>Служба поддержки</span>
        </a>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('user-name').innerText = user.username ? 'Smart ' + user.username : user.first_name;
            
            // Если у пользователя есть фото в ТГ, загружаем его через CORS-прокси bypass
            if (user.photo_url) {
                const proxyUrl = 'https://weserv.nl' + encodeURIComponent(user.photo_url);
                document.getElementById('user-avatar').src = proxyUrl;
            }
        } else {
            // Если открыто в обычном браузере, оставляем логотип из фото
            document.getElementById('user-name').innerText = "ROBLOX CHEATS";
        }
    </script>
</body>
</html>
